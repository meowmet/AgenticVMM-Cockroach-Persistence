[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-vmm"
version = "0.1.0"
description = "Hardware-Accelerated Virtual Memory Manager for LLM Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AgenticVMM Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "llama-cpp-python>=0.2.77",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_vmm*"]

[project.urls]
"Homepage" = "https://github.com/yourusername/agentic-vmm"
"Bug Tracker" = "https://github.com/yourusername/agentic-vmm/issues"
